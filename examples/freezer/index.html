<script>

const CUES = [

  [25.40, 28.00, 'AND FLIPPED THEM INTO !DEFROST !MODE'], [28.00, 29.70, 'AND IT’S THE *SECOND *WAVE'],
  [29.70, 31.40, 'IN OCTOBER, A SIMILAR ATTACK IN FRANCE'], [31.40, 33.40, 'HIT AROUND *700 SUPERMARKETS'], [33.40, 36.00, 'AND SOME STORES EVEN !CAUGHT !FIRE'],
  [36.00, 37.40, 'TONS OF FOOD…'], [37.40, 39.00, 'STRAIGHT IN THE !TRASH'], [39.00, 40.90, 'THIS IS THE NEW ERA OF HACKING'],
  [40.90, 42.70, 'NOT STEALING YOUR DATA…'], [42.70, 45.00, 'ATTACKING THE *PHYSICAL *WORLD'], [45.00, 46.70, 'FRIDGES, FREEZERS, FACTORIES.'],
  [46.70, 49.00, 'IF IT’S ONLINE, IT’S A !TARGET'], [49.00, 50.60, 'SO THE NEXT TIME THE FREEZER AISLE'], [50.60, 52.00, 'IS EMPTY, REMEMBER—'],
];
const CUTS = [5, 9, 15, 21, 28, 36, 39, 45];
const IMPACTS = [[4.10, .35], [5.15, .55], [12.40, .45], [16.30, .25], [20.30, .25], [24.90, .25], [26.60, .45], [28.15, .90], [31.40, .30],
  [33.60, .50], [37.40, .40], [42.70, .55], [46.90, .45]];
const FLASHES = [[4.10, .30, '#ff6a1f', .20], [5.15, .18, '#ffffff', .15], [12.40, .30, '#ff3b3b', .25], [26.60, .30, '#ff3b3b', .25],
  [28.15, .40, '#ffffff', .60], [33.60, .35, '#ff6a1f', .30], [42.70, .30, '#ff3b3b', .30], [46.90, .25, '#ff3b3b', .25],
  ...CUTS.map(s => [s, .12, '#ffffff', .12])];
const HEAT = [[0, '#7dd3fc'], [.45, '#f4f4f5'], [.75, '#fb923c'], [1, '#ef4444']];
const $ = (s, r) => r.querySelector(s), $$ = (s, r) => r.querySelectorAll(s);

K.start({ T, fps: 30 }, () => {
  K.grain('#grain', { opacity: .07 });
  K.bgDots('#dots', { gap: 36, drift: 1, alpha: .075 });
  const glows = K.bgGlows('#bg', [{ x: 230, y: 560, r: 560, c: '#0ea5e9', ax: 70, ay: 40, k: 1, a: .5 }, { x: 880, y: 1240, r: 600, c: '#6366f1', ax: 80, ay: 60, k: 2, a: .42 }]);
  const hook = { v: 0 };
  const heat = t => (t < 5 ? hook.v / 122 : 0);
  K.bgParticles('#bg', { n: 70, color: '#e0f2fe', size: [2, 5], m: 1, dir: 1, alpha: .55, seed: 4,
    show: t => (t < 5 ? 1 - K.clamp(heat(t) * 1.6) : t >= 49 ? K.prog(t, 49, 50) : 0) });
  K.bgParticles('#bg', { n: 46, color: '#fb923c', size: [2, 5], m: 2, dir: -1, alpha: .7, seed: 9, wobble: 26,
    show: t => (t < 5 ? K.clamp((heat(t) - .55) * 2.5) : t >= 33.4 && t < 36 ? K.prog(t, 33.4, 34) : 0) });
  K.bgPaths('#bg', { n: 16, color: '251,113,133', alpha: .09, show: t => (t >= 39 && t < 45 ? Math.min(K.prog(t, 39, 39.6), 1 - K.prog(t, 44.6, 45)) : 0) });
  // background glow colours follow the story: cold → hot → tech → fire → cold again (matches frame 0 for the loop)
  const GK = [[5, '#ef4444', '#9f1239'], [9, '#f97316', '#b91c1c'], [15, '#f59e0b', '#dc2626'], [21, '#06b6d4', '#7c3aed'], [26.6, '#ef4444', '#7c3aed'],
    [28, '#ef4444', '#f97316'], [36, '#d97706', '#92400e'], [39, '#7c3aed', '#be123c'], [45, '#dc2626', '#7f1d1d'], [49, '#0ea5e9', '#6366f1']];
  K.frame(t => {
    let a, b;
    if (t < 5) { const h = heat(t); a = K.mix('#0ea5e9', '#f97316', h); b = K.mix('#6366f1', '#ef4444', h); }
    else {
      let i = GK.length - 1; while (GK[i][0] > t) i--;
      const prev = i === 0 ? [0, '#f97316', '#ef4444'] : GK[i - 1], p = K.prog(t, GK[i][0], GK[i][0] + .5);
      a = K.mix(prev[1], GK[i][1], p); b = K.mix(prev[2], GK[i][2], p);
    }
    glows[0].style.setProperty('--c', a); glows[1].style.setProperty('--c', b);
  });

  // ================================================================ HOOK 0–5 — kit.hookScene also shows its first frame under the loop's last 0.65 s
  const { el: hk } = K.hookScene('hook', 5, (tl, el) => {
    el.innerHTML = `    <div class="island-wrap"><div class="island i-ok"><span class="live" style="background:#34d399;box-shadow:0 0 0 7px rgba(52,211,153,.22)"></span>FREEZER 07 · ONLINE</div>
      <div class="island i-bad"><span class="live"></span>ALERT · TEMP CRITICAL</div></div>
    <div class="card glass ring-glow tele">
      <div class="head"><div class="kicker">Cold storage · Aisle 4</div>
        <div class="icons"><div class="ic-snow" style="color:#7dd3fc">${K.icon('snowflake', { size: 84, sw: 1.8 })}</div><div class="ic-flame" style="color:#fb923c">${K.icon('flame', { size: 84, sw: 1.8 })}</div></div></div>
      <div class="temp">0°F</div><div class="sub">−18°C · safe at or below 0°F</div>
      <svg class="spark" width="816" height="150" viewBox="0 0 816 150">
        <defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
        <linearGradient id="ha" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef4444" stop-opacity=".35"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient></defs>
        <path class="area" fill="url(#ha)"/><path class="line" fill="none" stroke="url(#hg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="stamp crit">CRITICAL</div>
    </div>`;
    {
      const pts = [];
      for (let x = 0; x <= 816; x += 12) pts.push([x, 140 - 128 * Math.pow(x / 816, 2.4) + Math.sin(x * .09) * 3 * (1 - x / 816)]);
      const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
      $('.line', el).setAttribute('d', d);
      $('.area', el).setAttribute('d', d + ' L816 150 L0 150 Z');
    }
    tl.to(hook, { v: 122, duration: 3.6, ease: 'power2.in' }, .3)
      .fromTo($('.line', el), { drawSVG: '0% 1%' }, { drawSVG: '0% 100%', duration: 3.6, ease: 'power2.in' }, .3)
      .fromTo($('.area', el), { clipPath: 'inset(0% 99% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 3.6, ease: 'power2.in' }, .3)
      .to($('.ic-snow', el), { autoAlpha: 0, rotation: 120, scale: .4, duration: .35, ease: 'power2.in' }, 2.0)
      .fromTo($('.ic-flame', el), { autoAlpha: 0, scale: .3 }, { autoAlpha: 1, scale: 1, duration: .5, ease: 'back.out(2.5)' }, 2.2)
      .to($('.i-ok', el), { autoAlpha: 0, y: -26, duration: .28, ease: 'power2.in' }, 2.8)
      .fromTo($('.i-bad', el), { autoAlpha: 0, y: 26, scale: .9 }, { autoAlpha: 1, y: 0, scale: 1, duration: .45, ease: 'back.out(2)' }, 2.9)
      .fromTo($('.crit', el), { autoAlpha: 0, scale: 2.3, rotation: -18 }, { autoAlpha: 1, scale: 1, rotation: -9, duration: .32, ease: 'expo.out' }, 4.1)
      .fromTo($('.tele', el), { scale: 1.035 }, { scale: 1, duration: .45, ease: 'back.out(3)', immediateRender: false }, 4.1);
  });
  const tempEl = $('.temp', hk), subEl = $('.sub', hk), tele = $('.tele', hk);
  K.frame(t => {
    const v = hook.v, h = v / 122, c = Math.round((v - 32) * 5 / 9);
    const s = Math.round(v) + '°F';

      .fromTo(tm, { y: 160, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .45, ease: 'expo.out' }, 2.55)

  // ================================================================ WAVE 28–36
  K.scene('wave', 28, 36, (tl, el) => {

  // ================================================================ TRASH 36–39
  K.scene('trash', 36, 39, (tl, el) => {

  // ================================================================ ERA 39–45
  K.scene('era', 39, 45, (tl, el) => {
    el.innerHTML = `<div class="era-t"><div class="kicker">This is</div><div class="h1 era-h">THE NEW ERA</div><div class="h1 era-h2 grad-text">OF HACKING</div></div>
      <div class="card era-c era-a"><div class="icon-tile" style="--c:#a1a1aa">${K.icon('database', { size: 46 })}</div><div class="t1">Stealing data</div><div class="t2">passwords · cards · emails</div>

      .fromTo($('.era-h2', el), { y: 50, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .5, ease: 'expo.out' }, .4)

  K.scene('targets', 45, 49, (tl, el) => {
    el.innerHTML = `<div class="tg-row">${[['fridge', 'FRIDGES'], ['snowflake', 'FREEZERS'], ['factory', 'FACTORIES']].map(([ic, n]) =>
      `<div class="card tg ring-glow"><div class="tg-ic">${K.icon(ic, { size: 110, sw: 1.6 })}</div><div class="tg-n">${n}</div>
        <div class="tg-st"><span class="s-on">● ONLINE</span><span class="s-tg">● TARGET</span></div><div class="ret">${K.icon('crosshair', { size: 190, sw: 1.2 })}</div></div>`).join('')}</div>

    const tg = $$('.tg', el);

      .to($$('.ret', el), { rotation: 45, duration: 2, ease: 'none' }, 2.3)

      .to($('.scan', el), { autoAlpha: 0, duration: .2 }, 2.55);

  K.scene('loop', 49, 52, (tl, el) => {
    el.innerHTML = `<div class="aisle"><div class="kicker ai-k">Aisle 4 · Frozen</div>
      <div class="doors">${[0, 1, 2].map(() => '<div class="door"><i class="sh"></i><i class="sh"></i><i class="sh"></i><i class="sh"></i><b class="hd"></b><span class="light"></span></div>').join('')}</div>

    const lights = $$('.light', el);
    K.frame(t => {

  K.captions(CUES);
  K.camera('#world', { impacts: IMPACTS, kicks: CUTS, pushes: [[0.7, 5.0, 0.05]] });
